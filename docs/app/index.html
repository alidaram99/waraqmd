<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  S6 fix: this app renders files from any source (downloads, phone shares,
  another agent's output) as HTML/SVG, so a defense-in-depth CSP matters
  even though markdown-render.mjs already escapes raw HTML and app.js now
  sanitizes Mermaid's SVG with DOMPurify (src/lib/sanitize-svg.mjs) before
  it touches innerHTML. script-src has NO 'unsafe-inline': the app has zero
  inline <script> and zero inline event-handler attributes (the one that
  existed, the welcome screen's onclick, was moved to an addEventListener
  in app.js for exactly this reason). style-src keeps 'unsafe-inline'
  deliberately — KaTeX and Mermaid both position output almost entirely via
  inline style="..." attributes generated per-render, so precomputed hashes
  are not practical; this is a documented, narrower trade-off (CSS alone
  cannot execute script) rather than a blanket exception. See
  docs/app/../../SECURITY.md and the S6 Resolution note in
  docs/reviews/four-products-security-review.md (main monorepo) for the
  full reasoning.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Waraq — Markdown reader &amp; editor</title>
<meta name="description" content="Open, edit and save Markdown files offline. Mermaid, math, tables, task lists, automatic Arabic/English direction.">
<!--
  SEO decision (round-10 technical SEO, documented in marketing/tech-seo-round1.md in the
  main monorepo): this page is the app shell — a near-empty document until app.js runs, with
  no unique server-rendered text for a crawler to index, and its value proposition is already
  the home page's (/) job, which is content-rich, has FAQ/HowTo JSON-LD, and is the page meant
  to rank. Indexing this one too would just compete with that page for the same queries. So:
  noindex (don't rank this URL), follow (don't block crawling onward), with a self-canonical
  kept anyway as hygiene in case this URL is ever reached with extra query parameters.
-->
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://alidaram99.github.io/waraqmd/app/">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Waraq">
<link rel="stylesheet" href="./assets/app.css">
<link rel="stylesheet" href="./assets/katex.min.css">
</head>
<body>
<div id="waraq-drop-overlay" class="waraq-drop-overlay hidden" data-i18n="dropHint">Drop a Markdown file here, or paste text</div>

<header id="waraq-toolbar" class="waraq-toolbar">
  <button id="waraq-btn-new" data-i18n="newFile">New</button>
  <button id="waraq-btn-open" data-i18n="openFile">Open file</button>
  <button id="waraq-btn-save" data-i18n="save">Save</button>
  <button id="waraq-btn-save-as" data-i18n="saveAs">Save as…</button>
  <span style="border-left:1px solid var(--border);height:1.4em;margin:0 .2em"></span>
  <button id="waraq-btn-mode-edit" data-i18n="edit" aria-pressed="false">Edit</button>
  <button id="waraq-btn-mode-split" data-i18n="split" aria-pressed="true">Split</button>
  <button id="waraq-btn-mode-preview" data-i18n="preview" aria-pressed="false">Preview</button>
  <button id="waraq-btn-toc" data-i18n="tableOfContents">Contents</button>
  <span class="waraq-spacer"></span>
  <span id="waraq-filename" class="waraq-filename"></span>
  <span id="waraq-status" class="waraq-status"></span>
  <button id="waraq-btn-print" data-i18n="print" data-i18n-title="print" title="Print / Export PDF">🖨️</button>
  <button id="waraq-btn-export-html" data-i18n-title="exportHtml" title="Export standalone HTML">⇩ HTML</button>
  <button id="waraq-btn-theme" data-i18n-title="theme" title="Theme">🖥️</button>
  <button id="waraq-btn-lang" data-i18n-title="language" title="Language">AR</button>
  <button id="waraq-btn-install" class="hidden">⬇ Install</button>
</header>

<main class="waraq-main">
  <nav id="waraq-sidebar" class="waraq-sidebar hidden" aria-label="Table of contents">
    <strong data-i18n="tableOfContents">Contents</strong>
    <div id="waraq-toc"></div>
    <hr>
    <strong data-i18n="recentFiles">Recent files</strong>
    <ul id="waraq-recent-list" class="waraq-recent"></ul>
  </nav>

  <div id="waraq-panes" class="waraq-panes split">
    <div id="waraq-editor-pane" class="waraq-pane">
      <textarea id="waraq-editor" spellcheck="false" placeholder="# Start writing…"></textarea>
    </div>
    <div id="waraq-preview-pane" class="waraq-pane waraq-preview-pane">
      <article id="waraq-preview" class="waraq-preview" dir="auto"></article>
    </div>
  </div>
</main>

<div id="waraq-welcome" class="waraq-welcome hidden">
  <p data-i18n="dropHint">Drop a Markdown file here, or paste text</p>
  <button id="waraq-welcome-open" data-i18n="openFile">Open file</button>
</div>

<input type="file" id="waraq-file-input" class="hidden">

<script type="module" src="./assets/app.js"></script>
</body>
</html>
